spring.application.name=api-gateway
server.port=8080

# Eureka registration and discovery
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# User Service route
spring.cloud.gateway.server.webflux.routes[0].id=user-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users,/users/**

# Order Service route
spring.cloud.gateway.server.webflux.routes[1].id=order-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders,/orders/**